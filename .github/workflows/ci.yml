name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # 開発は Docker に閉じるが、CI は各 OS のネイティブ環境でテストする。
    # macOS、Windows、Linux の実際の差(パス区切り、改行、ファイルシステム)を検出するため。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt が必要なファイル:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - run: go test ./...
